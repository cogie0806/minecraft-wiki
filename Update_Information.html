<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイクラアップデート情報 - cogie0806マイクラwiki</title>
    
    <link rel="icon" href="cogie0806.jpg" type="image/jpeg">

    <style>
        /* 背景画像の設定 */
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 10px;
            font-family: sans-serif;
            background-image: url('MC26.3.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
        }
        
        /* タイトル文字を白くして、影をつけて見やすくしました */
        h1, h2 {
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), -1px -1px 0 rgba(0,0,0,0.9), 1px -1px 0 rgba(0,0,0,0.9), -1px 1px 0 rgba(0,0,0,0.9), 1px 1px 0 rgba(0,0,0,0.9);
        }
        
        /* リンクボタンのデザイン */
        .link-btn {
            display: block;
            text-align: center;
            background-color: #10b981; 
            color: white;
            text-decoration: none; 
            padding: 12px; 
            margin: 8px 0;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .link-btn:hover {
            background-color: #059669; 
        }
        .ai-btn {
            background-color: #3b82f6;
        }
        .ai-btn:hover {
            background-color: #2563eb;
        }
        
        /* ニュースボックス（白を濃くして文字を読みやすく、角を丸くしました） */
        .news-box {
            padding: 15px; 
            border: 1px solid #ccc;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.95); 
            color: #111111; 
            word-wrap: break-word; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); 
        }
    </style>
</head>
<body>

    <h1>マイクラアップデート情報</h1>
    <div class="nav-bar">
        <!-- 💡 タイポ（URL末尾の // ）もここで一緒に直しておきました -->
        <a id="link-search" class="link-btn ai-btn" href="https://github.io">🔄 wikiトップに戻る</a>
    </div>

    <h2>26.4</h2>
    <div id="news1" class="news-box">読み込み中...</div>

    <h2>26.3</h2>
    <div id="news2" class="news-box">読み込み中...</div>
    
    <h2>26.2</h2>
    <div id="news3" class="news-box">読み込み中...</div>

    <script>
        function loadNews(file, elementId) {
            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('ファイルが見つかりません');
                    return response.text();
                })
                .then(data => {
                    document.getElementById(elementId).innerText = data;
                })
                .catch(error => {
                    document.getElementById(elementId).innerText = "アップデート情報の読み込みに失敗しました。";
                });
        }

        loadNews('news1.txt', 'news1');
        loadNews('news2.txt', 'news2');
        loadNews('news3.txt', 'news3');
    </script>

</body>
</html>
